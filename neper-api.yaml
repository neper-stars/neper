---

swagger: "2.0"
basePath: /api
info:
  description: |
    The Neper API

  title: Neper API
  version: 1.0.0
consumes:
  - application/json
produces:
  - application/json
schemes:
  - http
  - https

securityDefinitions:
  key:
    type: apiKey
    in: header
    name: Authorization
security:
  - key: []

paths:
  /v1/auth/authenticate:
    post:
      operationId: authenticate
      security: []
      parameters:
        - name: credentials
          in: body
          schema:
            $ref: "#/definitions/credentials"
      responses:
        200:
          description: A Json Web Token with a 5 minutes validity
          schema:
            type: string
        401:
          description: Invalid credentials
          schema:
            $ref: "neper-types.yaml#/definitions/error"
        default:
          description: generic error response
          schema:
            $ref: "neper-types.yaml#/definitions/error"

  /v1/auth/register:
    post:
      operationId: register
      summary: "request a new user account"
      description: |
        Submit a registration request for a new user account.
        The user gets an API key immediately and can authenticate,
        but has limited access until approved by a global manager.
        Pending users can list and view sessions, but cannot create or join them.
        This endpoint does not require authentication.
      security: []
      parameters:
        - name: registration
          in: body
          required: true
          schema:
            $ref: "neper-types.yaml#/definitions/registration_request"
      responses:
        201:
          description: Registration successful. User can authenticate but has limited access until approved.
          schema:
            $ref: "neper-types.yaml#/definitions/registration_result"
        400:
          $ref: "#/responses/invalid"
        409:
          description: Email or nickname already exists
          schema:
            $ref: "neper-types.yaml#/definitions/error"
        429:
          description: Too many registration attempts. Please try again later.
          schema:
            $ref: "neper-types.yaml#/definitions/error"
        503:
          description: Registration is currently disabled
          schema:
            $ref: "neper-types.yaml#/definitions/error"
        default:
          $ref: "#/responses/default"

  /v1/downloads/stars.exe:
    get:
      operationId: downloadStarsExe
      summary: "download the Stars! game executable"
      description: |
        Download the embedded Stars! game executable (stars.exe).
        This is the game client needed to play Stars! games.
      produces:
        - application/octet-stream
      responses:
        200:
          description: The Stars! executable binary
          schema:
            type: file
        401:
          $ref: "#/responses/unauthorized"
        default:
          $ref: "#/responses/default"

  /v1/auth/refresh_token:
    post:
      operationId: refresh-token
      responses:
        200:
          description: A Json Web Token with a 5 minutes validity
          schema:
            type: string
        default:
          description: generic error response
          schema:
            $ref: "neper-types.yaml#/definitions/error"

  /v1/auth/userinfo:
    get:
      operationId: userinfo
      responses:
        200:
          description: Returns the current user information
          schema:
            $ref: "#/definitions/userinfo"
        default:
          description: generic error response
          schema:
            $ref: "neper-types.yaml#/definitions/error"

  /v1/notifications:
    get:
      operationId: notifications
      summary: WebSocket endpoint for real-time resource change notifications
      description: |
        Upgrades to WebSocket connection. Sends JSON notifications when
        resources the user has access to are modified.

        See neper-async-types.yaml for message schema definitions:
        - resource-change: Base message format for all notifications
        - session-delete-metadata: Metadata for session deletion
        - session-member-left-metadata: Metadata for member_left action
        - invitation-delete-metadata: Metadata for invitation deletion
        - session-turn-metadata: Metadata for session_turn ready
        - order-status-metadata: Metadata for order status updates

        Access control:
        - session: Public sessions visible to all, private sessions to members/invitees only
        - invitation: Only visible to the invited user
        - race: Only visible to the race owner
        - ruleset: Visible to session members
        - session_player_race: Visible to session members
        - session_turn: Visible to session members
        - order_status: Visible to session members
        - pending_registration: Global managers only

        Example message:
        ```json
        {
          "type": "session",
          "id": "abc123",
          "action": "updated",
          "timestamp": 1702400000,
          "metadata": {}
        }
        ```
      responses:
        101:
          description: WebSocket upgrade successful
        401:
          $ref: "#/responses/unauthorized"
        default:
          $ref: "#/responses/default"

  /v1/sessions:
    get:
      operationId: sessionsList
      responses:
        200:
          description: the complete list of viewable sessions
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    post:
      operationId: sessionCreate
      description: |
        Creates a new session
      parameters:
        - name: session
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/session"
      responses:
        201:
          description: the created session
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/invite:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    post:
      operationId: invitationCreate
      parameters:
        - name: invitation
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/invitation"
      summary: "invite a player to a session. You can do this if you are the manager of this session."
      description: "invite a player to the session"
      responses:
        201:
          description: the invitation that has just been created
          schema:
            $ref: "neper-types.yaml#/definitions/invitation"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        409:
          $ref: "#/responses/conflict"
        default:
          $ref: "#/responses/default"

  /v1/invitations:
    get:
      operationId: invitationList
      summary: List invitations received by the current user
      description: |
        Returns all pending invitations where the current user is the invitee.
      responses:
        200:
          description: the complete list of viewable invitations
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/invitation"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/invitations/sent:
    get:
      operationId: invitationSentList
      summary: List invitations sent by the current user
      description: |
        Returns all pending invitations where the current user is the inviter.
      responses:
        200:
          description: the list of invitations sent by the current user
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/invitation"
        401:
          $ref: "#/responses/unauthorized"
        default:
          $ref: "#/responses/default"

  /v1/invitations/{invitation_id}:
    parameters:
      - name: invitation_id
        in: path
        type: string
        required: true
    put:
      operationId: invitationAccept
      description: |
        Join a session by accepting the invitation.
        You will become member of the session that is referenced in
        the invitation.
        You can only accept an invitation that was addressed to you,
        otherwise you will receive a 403 response.
        In case of success you will receive the session details of the session
        you just accepted to join.
        Cannot join a session that has already started (returns 412).
      responses:
        200:
          description: the session you just joined
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        409:
          $ref: "#/responses/conflict"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"
    delete:
      operationId: invitationDecline
      description: |
        Decline an invitation and remove it from the system.
        You can only decline an invitation that was addressed to you,
        otherwise you will receive a 403 response.
      responses:
        204:
          $ref: "#/responses/nocontent"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/join:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    post:
      operationId: sessionJoin
      summary: "Join the public session"
      description: |
        join the session. It must be a public session.
        If the session is private and you have an invitation
        use the invitationAccept operation.
        Cannot join a session that has already started (returns 412).
      responses:
        200:
          description: the session that has been joined
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/quit:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    post:
      operationId: sessionQuit
      summary: "Leave the session"
      description: |
        Leave the session as a member. Managers can only leave if at least
        one other manager remains in the session.
      responses:
        204:
          description: successfully left the session
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/promote/{user_profile_id}:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
      - name: user_profile_id
        in: path
        type: string
        required: true
    post:
      operationId: sessionPromoteMember
      summary: "Promote a member to manager"
      description: |
        Promote an existing session member to manager status.
        Only session managers or global managers can perform this action.
        The target user must already be a member of the session.
      responses:
        204:
          description: member successfully promoted to manager
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/player_race:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    get:
      operationId: sessionPlayerRaceGet
      summary: "get your race file for this session"
      description: |
        Returns the race file (.r1 format, base64 encoded) that you have set for this session.
        This allows you to download your race configuration for the current session.
      responses:
        200:
          description: the player's race for this session
          schema:
            $ref: "neper-types.yaml#/definitions/race"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"
    post:
      operationId: sessionPlayerRaceCreate
      summary: "set the race with which you will be competing in this session"
      description: |
        You will have to reference a previously uploaded race definition to indicate the host the race file
        you will be using for this session.
        If you are the host you will be able to change all races (in order to set some races for the bots)
        You will also be able to determine the player order.
        Players are not authorized to set their own order and an attempt to set this field will be ignored.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "session_player_race"
          in: "body"
          schema:
            $ref: "neper-types.yaml#/definitions/session_player_race"
      responses:
        200:
          description: the updated session
          schema:
            $ref: "neper-types.yaml#/definitions/session_player_race"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/player_race/ready:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    put:
      operationId: sessionPlayerRaceSetReady
      summary: "set the ready flag on the race you are playing with, in this session"
      description: |
        As a player, after setting a race file as the one you want to compete with,
        you must mark it as ready, to allow for the manager to start the game. This
        allows you to still change your mind as long as the ready flag is not set.
      parameters:
        - name: ready
          in: body
          required: true
          schema:
            type: boolean
      responses:
        200:
          description: the updated session player race mapping
          schema:
            $ref: "neper-types.yaml#/definitions/session_player_race"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/reorder_players:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    put:
      operationId: reorderPlayers
      description: |
        Update the session player order

        This is restricted to global managers or
        managers of the specific session
      parameters:
        - name: players
          in: body
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/player_order"
      responses:
        200:
          description: the updated player order
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/player_order"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    get:
      operationId: sessionRead
      description: |
        Return the session.
      responses:
        200:
          description: the session
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    put:
      operationId: sessionUpdate
      description: |
        Update the session

        This is restricted to global managers or
        managers of the specific session
      parameters:
        - name: session
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/session"
      responses:
        200:
          description: the updated session
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    delete:
      operationId: sessionDelete
      description: |
        Delete a session and all related data (player races, invitations, rules, game files).

        This is restricted to global managers or
        managers of the specific session.
      responses:
        204:
          description: session deleted successfully
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/rules:
    get:
      operationId: rulesRead
      description: |
        Return the session rules.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: the session rules
          schema:
            $ref: "neper-types.yaml#/definitions/ruleset"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    post:
      operationId: rulesCreate
      summary: "create or update rules for your session"
      description: |
        Set the rules for this session. If rules already exist, they will be updated.
        You must be the session owner/manager to use this endpoint.
        Rules cannot be modified once the session has started (returns 412).
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "ruleset"
          in: "body"
          schema:
            $ref: "neper-types.yaml#/definitions/ruleset"
      responses:
        200:
          description: the uploaded ruleset
          schema:
            $ref: "neper-types.yaml#/definitions/ruleset"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/game:
    post:
      operationId: gameCreate
      summary: "initialize the game for this session"
      description: |
        Generate the first turn for this session, using the previously uploaded ruleset
        and all the player races.
        This means all players must have uploaded a valid race file,
        the rules must be set, AND all players must be marked as ready.
        You must be the session owner/manager to be able to use this endpoint.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        201:
          description: the turn files for the requesting player
          schema:
            $ref: "neper-types.yaml#/definitions/turn_files"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/files:
    get:
      operationId: sessionFilesGet
      summary: "get all session files (managers only)"
      description: |
        Returns all session files for the current/latest turn including the host file (.hst),
        universe file (.xy), all player turn files (.mN), and all order files (.xN).
        This endpoint is restricted to session managers and global managers only.
        Regular players should use the /turn/latest endpoint to get their own turn file.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: "all session files for the latest turn"
          schema:
            $ref: "neper-types.yaml#/definitions/session_files"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/backup:
    get:
      operationId: historicBackup
      summary: "download a zip backup of all historic game files"
      description: |
        Returns a ZIP file containing all historic game files for a session.

        For regular players (session members):
        - Gets their own turn files (.mN) for all years
        - Gets universe files (.xy) for all years
        - Gets their race file (.rN)
        - Files are named with year suffix: game-2400.m1, game-2401.m1, etc.

        For session managers and global managers:
        - Gets ALL files including host files (.hst)
        - Gets ALL player turn files (.mN for all players)
        - Gets ALL race files (.rN for all players)
        - Gets universe files (.xy) for all years
        - Files are named with year suffix

        The session must be started (have at least one turn generated) for this endpoint to work.
      produces:
        - application/zip
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: "ZIP file containing all historic game files"
          schema:
            type: file
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        412:
          description: "Session has not started yet (no turns generated)"
          schema:
            $ref: "neper-types.yaml#/definitions/error"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/turn/latest:
    get:
      operationId: turnLatest
      summary: "get the latest turn for this session"
      description: |
        Returns the turn files for the most recent turn (highest year) in this session.
        This is useful for clients that want to fetch the current turn without knowing the year.
        You will get a turn_files structure containing the Universe file (.xy) data in a base64 encoded field
        and the Turn file (.mN) data in a base64 encoded field.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: "the latest turn files"
          schema:
            $ref: "neper-types.yaml#/definitions/turn_files"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/turn/{year}:
    get:
      operationId: turnGet
      description: |
        get your turn files
        You will get a player_turn structure containing the Universe file (.xy) data in a base64 encoded field
        and the Turn file (.mN) data in a base64 encoded field
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "year"
          in: "path"
          type: "integer"
          required: true
      responses:
        200:
          description: "the returned player turn"
          schema:
            $ref: "neper-types.yaml#/definitions/turn_files"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    put:
      operationId: turnSubmit
      summary: "submit your orders for the turn"
      description: |
        Submit your turn order file (.xN, where N is your player number)
        You should obtain this file by clicking File > Save & Submit
        Alternatively you could just press F9 in the stars! client
        A 409 error may occur if you resubmit a turn file but another one is still
        waiting to be used for turn generation. Make sure to only upload your submitted
        turn file ONCE.
        A 422 error may occur if you submit a turn file which is not marked as submitted by stars,
        ie you just clicked File > Save and uploaded your .xN file. The server will reject those files
        as 422 errors since they are not yet "submitted" in stars parlance.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "year"
          in: "path"
          type: "integer"
          required: true
        - name: "turnfile"
          in: "body"
          schema:
            $ref: "neper-types.yaml#/definitions/order"
      responses:
        200:
          description: the orders for this turn has been accepted
        400:
          $ref: "#/responses/invalid"
        409:
          $ref: "#/responses/conflict"
        422:
          $ref: "#/responses/unprocessable"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/orders/{year}:
    get:
      operationId: ordersStatus
      summary: "get the order submission status for all players"
      description: |
        Returns a list of players with their order submission status for the given year.
        Each entry contains the player order number, nickname, and whether they have submitted their orders.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "year"
          in: "path"
          type: "integer"
          required: true
      responses:
        200:
          description: "list of players with their order submission status"
          schema:
            type: array
            items:
              $ref: "#/definitions/playerOrderStatus"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/pending_registrations:
    get:
      operationId: pendingRegistrationList
      summary: "list all pending registration requests"
      description: |
        Returns the list of all user profiles with pending=true.
        Only global managers can access this endpoint.
      responses:
        200:
          description: the list of pending user profiles
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/pending_registrations/{user_profile_id}/approve:
    post:
      operationId: pendingRegistrationApprove
      summary: "approve a pending registration request"
      description: |
        Approves a pending user profile by setting pending=false, is_active=true,
        and generating an API key for the user.
        Only global managers can approve registrations.
      parameters:
        - name: user_profile_id
          in: path
          type: string
          required: true
          description: the ID of the pending user profile to approve
      responses:
        200:
          description: the approved user profile with API key
          schema:
            $ref: "#/definitions/apikeyReset"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/pending_registrations/{user_profile_id}/reject:
    delete:
      operationId: pendingRegistrationReject
      summary: "reject a pending registration request"
      description: |
        Rejects and deletes a pending user profile.
        Only global managers can reject registrations.
      parameters:
        - name: user_profile_id
          in: path
          type: string
          required: true
          description: the ID of the pending user profile to reject
      responses:
        204:
          description: registration request rejected and user profile deleted
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/user_profiles:
    get:
      operationId: userProfileList
      responses:
        200:
          description: the complete list of user profiles
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    post:
      operationId: userProfileCreate
      description: |
        Creates a user profile. Only global managers can use this endpoint.
        The created user will be active immediately (no approval needed).
      parameters:
        - name: user_profile
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile_create_request"
      responses:
        201:
          description: the created user profile
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"

  /v1/user_profiles/{user_profile_id}:
    parameters:
      - name: user_profile_id
        in: path
        type: string
        required: true
    get:
      operationId: userProfileRead
      description: |
        Return the user_profile.
      responses:
        200:
          description: the user profile
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    put:
      operationId: userProfileUpdate
      description: |
        Update the user_profile.
      parameters:
        - name: user_profile
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
      responses:
        200:
          description: the updated user profile
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    delete:
      operationId: userProfileDelete
      description: |
        Delete a user profile. Only global managers can delete user profiles.
        Returns 409 Conflict if the user is a member of any session.
      responses:
        204:
          $ref: "#/responses/nocontent"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        409:
          $ref: "#/responses/conflict"
        default:
          $ref: "#/responses/default"

  /v1/user_profiles/{user_profile_id}/reset_apikey:
    parameters:
      - name: user_profile_id
        in: path
        type: string
        required: true
    post:
      operationId: userProfileResetApikey
      summary: "reset the API key for a user"
      description: |
        Generate a new random API key for the specified user.
        A user can reset their own API key, or a manager can reset any user's API key.
      responses:
        200:
          description: the new API key
          schema:
            $ref: "#/definitions/apikeyReset"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/user_profiles/{user_profile_id}/races:
    get:
      operationId: racesList
      parameters:
        - name: "user_profile_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: the complete list of races for this user
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/race"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    post:
      operationId: raceCreate
      summary: "upload your race file for future use in a session"
      description: "Each player will need to upload at least one race file using this endpoint. Alternatively the player can choose to use a standard race during session setup."
      parameters:
        - name: "user_profile_id"
          in: "path"
          type: "string"
          required: true
        - name: race
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/race"
      responses:
        201:
          description: "the uploaded race, with the auto calculated fields filled"
          schema:
            $ref: "neper-types.yaml#/definitions/race"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/user_profiles/{user_profile_id}/races/{race_id}:
    parameters:
      - name: "user_profile_id"
        in: "path"
        type: "string"
        required: true
      - name: "race_id"
        in: "path"
        type: "string"
        required: true
    get:
      operationId: raceRead
      description: |
        Return the asked race from your profile.
      responses:
        200:
          description: the race definition, including the datafile
          schema:
            $ref: "neper-types.yaml#/definitions/race"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    delete:
      operationId: raceDelete
      description: |
        Delete a race from your profile.
        You can only delete races that belong to you,
        unless you are a global manager.
        Returns 409 Conflict if the race is currently in use in a session.
      responses:
        204:
          $ref: "#/responses/nocontent"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        409:
          $ref: "#/responses/conflict"
        default:
          $ref: "#/responses/default"

responses:
  nocontent:
    description: Successful

  notfound:
    description: Resource not found
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  conflict:
    description: Resource already exists
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  unprocessable:
    description: Resource is not processable by the server
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  invalid:
    description: invalid client request
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  unauthorized:
    description: Invalid credentials
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  forbidden:
    description: Access forbidden
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  preconditionfailed:
    description: Precondition not met
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  default:
    description: Generic error response
    schema:
      $ref: "neper-types.yaml#/definitions/error"

definitions:
  apikeyReset:
    type: object
    description: Response containing the new API key after reset
    properties:
      user_id:
        type: string
        description: The user profile ID
      apikey:
        type: string
        description: The new API key
  playerOrderStatus:
    type: object
    description: Order submission status for a player
    properties:
      player_order:
        type: integer
        description: The player order number (0-15)
      nickname:
        type: string
        description: Player nickname
      is_bot:
        type: boolean
        description: True if this is a bot player
      submitted:
        type: boolean
        description: True if orders have been submitted for this turn
  credentials:
    type: object
    description: Credentials for authentication
    properties:
      nickname:
        type: string
        description: User nickname
      apikey:
        type: string
        description: User profile API Key
  userinfo:
    type: object
    description: Current user information
    properties:
      user:
        $ref: "#/definitions/user"
      serial_key:
        type: string
        description: The serial key assigned to this user for Stars! game registration
  user:
    type: object
    description: User information
    properties:
      id:
        type: string
        description: User ID
        x-go-custom-tag: db:"id"
      nickname:
        type: string
        description: User nickname
        x-go-custom-tag: db:"nickname"
