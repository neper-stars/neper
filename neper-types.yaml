definitions:
  error:
    type: object
    required:
      - message
    properties:
      code:
        type: integer
      message:
        type: string
    example: {
        "code": 500,
        "message": "Internal error"
    }

  validation-errors:
    type: array
    items:
      type: object
      x-nullable: false
      properties:
        phase:
          type: string
        rule:
          type: string
        field:
          type: string
        message:
          type: string

  location:
    type: object
    properties:
      bucket_name:
        type: string
      object_id:
        type: string
      provider:
        type: string
      region:
        type: string
      type:
        type: string

  file:
    type: object
    properties:
      type:
        type: string
        description: the file mimetype
      size:
        type: integer
        description: the file size in bytes
      filename:
        type: string
        description: the file name
      encoding:
        type: string
        description: the file encoding if meaningful
      location:
        $ref: '#/definitions/location'
      hash:
        type: array
        items:
          type: string

  session:
    type: object
    properties:
      id:
        type: string
        readOnly: true
        x-go-custom-tag: db:"id"
        x-nullable: false
      name:
        type: string
        description: name
        x-go-custom-tag: db:"name"
        x-nullable: false
      private:
        type: boolean
        description: if the session is private only the managers can add new members
        x-go-custom-tag: db:"private"
        x-nullable: false
      members:
        type: array
        description: array of member ids
        items:
          type: string
      managers:
        type: array
        description: array of manager ids
        items:
          type: string
      state:
        type: string
        enum: [pending, started, archived]
        description: |
          Session state:
          - pending: session is not started yet, players can modify their races
          - started: game is in progress, players cannot modify their races
          - archived: game is finished, not joinable, does not count towards session limits
        x-go-custom-tag: db:"state"
        x-nullable: false
      rules_is_set:
        type: boolean
        description: true if the ruleset has been configured for this session
        x-go-custom-tag: db:"rules_is_set"
        x-nullable: false
      players:
        type: array
        description: |
          Array of player info, sorted by player order.
          This is read-only.
          In this array this is normal to not always find all members+managers.
          You will find in this list only people who have already set the race
          with which they want to play.
        readOnly: true
        items:
          $ref: "#/definitions/session_player"
      pending_invitation:
        type: boolean
        description: |
          True if the current user has a pending invitation to this session
          but is not yet a member. This field is only set when the session
          is returned in the context of a specific user request.
        readOnly: true
        x-nullable: false
    required:
      - name

  session_player:
    type: object
    description: Information about a player in a session
    properties:
      user_profile_id:
        type: string
        description: the user profile id of the player
        x-nullable: false
      ready:
        type: boolean
        description: whether the player has marked their race as ready
        x-nullable: false
      player_order:
        type: integer
        format: int64
        description: |
          The order number for this player in the game.
          As there can be a maximum of 16 players in a Stars! game, the value range is limited between 0 and 15
        minimum: 0
        maximum: 15
        x-nullable: false
      is_bot:
        type: boolean
        description: Whether this player is an AI/bot player
        x-nullable: false
      bot_level:
        type: integer
        format: int64
        description: |
          The difficulty level for AI players (0=Random, 1=Easy, 2=Standard, 3=Tough, 4=Expert).
          Only applicable when is_bot is true.
        minimum: 0
        maximum: 4
        x-nullable: true

  invitation:
    type: object
    properties:
      id:
        type: string
        readOnly: true
        x-go-custom-tag: db:"id"
        x-nullable: false
      session_id:
        type: string
        description: "the session id for which this invitation is."
        x-go-custom-tag: db:"session_id"
        x-nullable: false
      user_profile_id:
        type: string
        description: "the user profile this invitation is addressed to."
        x-go-custom-tag: db:"user_profile_id"
        x-nullable: false
      inviter_id:
        type: string
        description: "the user profile id of the person who sent the invitation."
        x-go-custom-tag: db:"inviter_id"
        x-nullable: false
      session_name:
        type: string
        readOnly: true
        description: "the name of the session for which this invitation is. Auto-populated by the server."
        x-nullable: false
      inviter_nickname:
        type: string
        readOnly: true
        description: "the nickname of the user who sent the invitation. Auto-populated by the server."
        x-nullable: false
      invitee_nickname:
        type: string
        readOnly: true
        description: "the nickname of the user who is invited. Auto-populated by the server."
        x-nullable: false

  user_profile:
    type: object
    properties:
      id:
        type: string
        readOnly: true
        x-go-custom-tag: db:"id"
        x-nullable: false
      nickname:
        type: string
        description: user nickname (name displayed to other users)
        x-go-custom-tag: db:"nickname"
        x-nullable: false
      email:
        type: string
        description: user primary email
        x-go-custom-tag: db:"email"
        x-nullable: false
      is_active:
        type: boolean
        description: "true if the profile is active, ie the user can identify itself"
        readOnly: true
        x-go-custom-tag: db:"is_active"
        x-nullable: false
      is_manager:
        type: boolean
        description: "true if the profile is a global manager. This field is readonly"
        readOnly: true
        x-go-custom-tag: db:"is_manager"
        x-nullable: false
      pending:
        type: boolean
        description: |
          true if this is a pending registration that needs approval by a global manager.
          Pending users cannot authenticate until approved.
        readOnly: true
        x-go-custom-tag: db:"pending"
        x-nullable: false
      registration_message:
        type: string
        description: "optional message provided during registration explaining why they want to join"
        readOnly: true
        x-go-custom-tag: db:"registration_message"
        x-nullable: true

    required:
      - firstname
      - lastname
      - email

  registration_request:
    type: object
    description: Request body for user registration
    properties:
      nickname:
        type: string
        description: requested user nickname (must be unique)
        x-nullable: false
      email:
        type: string
        description: user email address (must be unique)
        x-nullable: false
      message:
        type: string
        description: optional message explaining why you want to join
        x-nullable: true
    required:
      - nickname
      - email

  registration_result:
    type: object
    description: Response containing the user profile and API key after registration
    properties:
      user_id:
        type: string
        description: The user profile ID
      nickname:
        type: string
        description: The user's nickname
      apikey:
        type: string
        description: The API key for authentication
      pending:
        type: boolean
        description: True if the user needs admin approval for full access

  user_profile_create_request:
    type: object
    description: Request body for creating a user profile (global managers only)
    properties:
      nickname:
        type: string
        description: user nickname (must be unique)
        x-nullable: false
      email:
        type: string
        description: user email address (must be unique)
        x-nullable: false
    required:
      - nickname
      - email

  player_order:
    type: object
    description: "the order of a player in a game session"
    properties:
      user_profile_id:
        type: string
        description: "the user profile id you want to set the order"
      player_order:
        type: integer
        x-nullable: false
        description: |
          The order number for this player. Only the host can set this value.
          As there can be a maximum of 16 players in a Stars! game, the value range is limited between 0 and 15
        minimum: 0
        maximum: 15

  session_player_race:
    type: object
    description: "a binding between a player race and a session. The host can also choose the player order."
    properties:
      id:
        type: string
        description: |
          id of this mapping. When creating a new entry, leave empty.
          When updating an existing bot player, provide the id to identify which bot to update.
        x-go-custom-tag: db:"id"
        x-nullable: false
      session_id:
        type: string
        description: "the session id on which this race will be used. This value is automatically set by the server."
        readOnly: true
        x-go-custom-tag: db:"session_id"
        x-nullable: false
      user_profile_id:
        type: string
        readOnly: true
        description: "the user profile is automatically set if you are a simple player. Only hosts can set this value to something different"
        x-go-custom-tag: db:"user_profile_id"
        x-nullable: false
      player_order:
        type: integer
        description: |
          The order number for this player. Only the host can set this value.
          As there can be a maximum of 16 players in a Stars! game, the value range is limited between 0 and 15
        x-go-custom-tag: db:"player_order"
        x-nullable: false
        minimum: 0
        maximum: 15
      race_id:
        type: string
        description: |
          the race ID you will use during this session
          For a normal player you must use the ID of a race file you previously uploaded
          in your user profile.
          
          If the host is adding a bot player here is the list of race ids to chose from:
            "0"=Random
            "1"=Robotoids
            "2"=Turindrones
            "3"=Automitrons
            "4"=Rototills
            "5"=Cybertrons
            "6"=Macintis
        x-go-custom-tag: db:"race_id"
        x-nullable: false
      ready:
        type: boolean
        description: |
          If the player is ready to play with this race in the corresponding session
          then he should mark this as ready in order to allow for the game to start.
          As long as this setting is not ready on all races, the game cannot start.
          As long as this setting is ready on a race, the player cannot change his
          race file. This allows for session managers to start a game without any
          "race conditions".
        x-go-custom-tag: db:"ready"
        x-nullable: false
      is_bot:
        type: boolean
        description: |
          if this player race should be player by a bot.
          If this value is true then you need to provide the bot_level.
          If this value is false any value given in the bot_level will be ignored
        x-go-custom-tag: db:"is_bot"
      bot_level:
        type: integer
        minimum: 0
        maximum: 4
        description: |
          if the player is a bot, the host can set a level with this field:
            0=Random
            1=Easy
            2=Standard
            3=Tough
            4=Expert
        x-go-custom-tag: db:"bot_level"
        x-nullable: true

  ruleset:
    type: object
    description: "a ruleset that will be applied during a session"
    properties:
      universe_size:
        type: integer
        minimum: 0
        maximum: 4
        description: |
          0: Tiny
          1: Small
          2: Medium
          3: Large
          4: Huge
        x-go-custom-tag: db:"universe_size"
        x-nullable: false
      density:
        type: integer
        minimum: 0
        maximum: 3
        description: |
          0: Sparse
          1: Normal
          2: Dense
          3: Packed
        x-go-custom-tag: db:"density"
        x-nullable: false
      starting_distance:
        type: integer
        minimum: 0
        maximum: 3
        description: |
          0: Close
          1: Moderate
          2: Farther
          3: Distant
        x-go-custom-tag: db:"starting_distance"
        x-nullable: false
      random_seed:
        type: integer
        description: |
          The optional Random Seed number forces the universe to be created exactly the same each time, if you use the same Seed number.
        x-go-custom-tag: db:"random_seed"
        x-nullable: false
      maximum_minerals:
        type: boolean
        x-go-custom-tag: db:"maximum_minerals"
        description: |
          This makes every world in the game start with maximum mineral concentrations,
          extending the game. If players don't have to worry about running out of
          minerals too soon, they will build their empire and remain relatively comfortable,
          unless provoked by another player.
          
          Note: A lot of players DO NOT like this parameter, being that it is pretty unrealistic
      slower_tech_advances:
        type: boolean
        x-go-custom-tag: db:"slower_tech_advances"
        description: |
          Controls the length of the game.
          
          This choice doubles the amount of resources necessary to achieve new technology.
          It gives players more time to utilize their existing technology before new tech. comes along.
          This usually means that players will build more ships of any particular class,
          creating dilemmas when their "slots" are full (16 designs).
          For Beginners: Due to the advanced planning of ship designs (what to build, when to build, how many),
          a host may not want to use this if designing a game for exclusively beginning level players.
      accelerated_bbs_play:
        type: boolean
        x-go-custom-tag: db:"accelerated_bbs_play"
        description: |
          Controls the length of the game and STRONGLY recommended.

          This feature advances the game by "advancing" the start time.
          Although the game will still start in the year 2400, all players will have built-up
          some minerals and population with this option.
          This speeds up the time taken to actually build your first vessels and to make
          contact with other players.
          Most players prefer this option.
      no_random_events:
        type: boolean
        x-go-custom-tag: db:"no_random_events"
        description: |
          Evens the flow of the game.
          
          This choice eliminates hidden mineral concentrations, the Mystery Trader, meteor impacts,
          and left-over tech. artifacts.
          If you want all players to be on an even par throughout the game, this is the item to choose.
          For pre-genned games: If you plan to start the game later in the timeline,
          be warned about the possibility of a meteor hitting a player's home-world prior to game start.
          If this happens, you should immediately re-start the game.
      computer_players_form_alliances:
        type: boolean
        x-go-custom-tag: db:"computer_players_form_alliances"
        description: |
          For Advanced players only.
          
          Computer players will only attack human players, not other AIs.
          The effectiveness of this parameter is decided by the number of computer AIs in the game.
          If you only have one or two, this will not make much of a difference in the game.
          However, with three or more AIs against Advanced level players, this parameter should definitely
          be chosen, since Advanced players already know how to beat the AIs hands-down.
      public_player_scores:
        type: boolean
        x-go-custom-tag: db:"public_player_scores"
        description: |
          Alters game strategy.
          
          If players know who is ahead in the game, they are more likely to immediately ally
          in order to stop the lead player.
          This leads to very interesting game play, revolving around alliances and back-stabbing.
          Not having this option forces players to construct large information gathering infrastructures,
          in order to ascertain the strengths of their opponents.
      galaxy_clumping:
        type: boolean
        x-go-custom-tag: db:"galaxy_clumping"
        description: |
          Alters game playing strategy.
          
          The clumping of planets switches the focus of the game over from controlling individual worlds,
          to controlling entire star clusters. This is more realistic.
          However: Many players dislike the fact that planet names have a tendency to print on top of other names,
          making it a real pain to quickly locate particular worlds.
      vc_owns_x_percent_of_planets:
        type: boolean
        x-go-custom-tag: db:"vc_owns_x_percent_of_planets"
        x-nullable: false
        description: |
          Enables the victory condition based on number of planets.
          If true, you will need to fill the vc_percent_of_planets field
          with the required percentage for this condition to be true.
          
          Owns "X"% of planets (Offensive strategy) -
          Be carefull how high you put this. Players with restricted habitability ranges will,
          generally, not be able to own more than 50% of all possible worlds.
          For the HE: Hyper-expansion will always have the advantage in a game with this victory condition.
          Perhaps this is one reason why HE is banned from most games.
      vc_owns_x_percent_of_planets_value:
        type: integer
        x-go-custom-tag: db:"vc_owns_x_percent_of_planets_value"
        minimum: 20
        maximum: 100
        description: required percentage
      vc_attain_tech_X_in_Y_field:
        type: boolean
        x-go-custom-tag: db:"vc_attain_tech_x_in_y_field"
        x-nullable: false
        description: |
          Attain Tech "X" in "Y" fields (Balanced strategy)
          Because tech-level acquisition goes hand in hand with resources,
          players desiring to meet this condition will angle their race towards more efficient tech production,
          as well as be encouraged to increase their size in order to harness more resources.
      vc_attain_tech_X_in_Y_field_tech_value:
        type: integer
        x-go-custom-tag: db:"vc_attain_tech_x_in_y_field_tech_value"
        minimum: 8
        maximum: 26
        description: tech value to attain
      vc_attain_tech_X_in_Y_field_fields_value:
        type: integer
        x-go-custom-tag: db:"vc_attain_tech_x_in_y_field_fields_value"
        minimum: 2
        maximum: 6
        description: number of fields to attain
      vc_exceed_score_of_x:
        type: boolean
        x-go-custom-tag: db:"vc_exceed_score_of_x"
        x-nullable: false
        description: |
          Exceed a score of "X" (Balanced strategy)
          Once again, resources are the deciding factor here,
          forcing a combination of good production efficiency and territory acquisition out of the players.
          
          "Hyper-producing" races may run amok in a game like this, scaring the hell out of other players,
          and causing an early war or two.
          
          Players could also win via this condition by manipulating other factors which can effect score,
          unlike the other victory condition two listings down.
          Additionally, as with any "total" type requirement, a host should be careful not to place unreal
          goals on a game that can not fulfil them.
          Having a higher score as a requirement to win in a small universe may be unattainable altogether.
      vc_exceed_score_of_x_value:
        type: integer
        x-go-custom-tag: db:"vc_exceed_score_of_x_value"
        minimum: 1000
        maximum: 20000
        description: score value to exceed to validate this victory condition.
      vc_exceed_next_player_score_by_x:
        type: boolean
        x-go-custom-tag: db:"vc_exceed_next_player_score_by_x"
        x-nullable: false
        description: |
          Exceed the next player's score by "X"% (Offensive strategy)
          This is perhaps the most popular victory condition, as it forces players to eliminate any opposition.
          This will create many alliances and politic-ing as lesser empires try to get an edge and
          chop down the leading players.
      vc_exceed_next_player_score_by_x_value:
        type: integer
        x-go-custom-tag: db:"vc_exceed_next_player_score_by_x_value"
        minimum: 20
        maximum: 300
        description: Percentage of score you need to have above the next player to score this victory condition.
      vc_has_production_capacity_of_x_thousand:
        type: boolean
        x-go-custom-tag: db:"vc_has_production_capacity_of_x_thousand"
        x-nullable: false
        description: |
          Has a production capacity of "X" thousand (Balanced strategy)
          This is very similar to the score requirement above,
          but it relies totally on the production of resources.
          Players will shoot for high production efficiency and conquest of worlds.
      vc_has_production_capacity_of_x_thousand_value:
        type: integer
        x-go-custom-tag: db:"vc_has_production_capacity_of_x_thousand_value"
        minimum: 10
        maximum: 500
        description: production value needed to score this victory condition
      vc_owns_x_capital_ships:
        type: boolean
        x-go-custom-tag: db:"vc_owns_x_capital_ships"
        x-nullable: false
        description: |
          Owns "X" capital ships (Defensive strategy)
          This really lends itself to keeping out of trouble for the player.
          Even though one can build capital ships, it is another thing to keep them intact in order to win the game.
          Also, because of the long time necessary in order to achieve the technology to build these ships,
          games will run a long time.
      vc_owns_x_capital_ships_value:
        type: integer
        x-go-custom-tag: db:"vc_owns_x_capital_ships_value"
        minimum: 10
        maximum: 300
        description: number of capital ships necessary to validate this victory condition
      vc_have_highest_score_after_x_years:
        type: boolean
        x-go-custom-tag: db:"vc_have_highest_score_after_x_years"
        x-nullable: false
        description: |
          Have the highest score after "X" years
          Consider this carefully.
          This is a bonus category which a player can score if they have the highest score any time
          after the year specified.
          This parameter should not be used in conjunction with the "Exceed next highest score by "X"%",
          since it already indicates that the player holding this category is ahead in the game.
          
          Because this is a relatively easy category to win, be sure to give other players a chance to win
          after one player wins this category.
          It should be used as an incentive to build quickly, but it should not decide the entire chances of victory.
      vc_have_highest_score_after_x_years_value:
        type: integer
        x-go-custom-tag: db:"vc_have_highest_score_after_x_years_value"
        minimum: 30
        maximum: 900
        description: Number of years after which this victory condition can be achieved.
      vc_winner_must_meet_x_of_the_above:
        type: integer
        x-go-custom-tag: db:"vc_winner_must_meet_x_of_the_above"
        x-nullable: false
        minimum: 0
        maximum: 7
        description: |
          Winner must meet "X" of the above selected criteria
          Selecting this will give players more than one way to win,
          if you set "X" to less than the number of selected categories.
          
          This will provide more ways to win and lead to interesting strategies that will effect
          one another as the game progresses.
          
          Making players meet the same set of conditions will lead to either a production game,
          with wars intermittent, or to a conquest game, with rampant death and destruction.
          
          Note: It is never wise to select virtually all conditions with every condition needing to be met.
          This will lead to a game where, once one player firmly establishes a lead,
          many players will probably cede victory without further play.
      vc_at_least_x_years_must_pass_before_a_winner_is_declared:
        type: integer
        x-go-custom-tag: db:"vc_at_least_x_years_must_pass_before_a_winner_is_declared"
        x-nullable: false
        minimum: 30
        maximum: 500
        description: |
          At least "X" years must pass before a winner is declared
          Simply put, how long do you want the game to go?
          Remember, one year in the game is usually equivalent to one turn played per day.
          Selecting 500 years means that the game will last at least 500 days of real time (more likely two full years).
          
          Since you are the one running the game and doing all the work,
          be sure to choose a time frame that you can live with.

  race:
    type: object
    description: |
      a race is the race file obtained by using the customize race wizard in stars.
      It will be uploaded and stored linked to a user profile in order to be used during a session setup.
    properties:
      id:
        type: string
        description: "auto generated unique id for this race file. This is the string representation of a uuid4."
        readOnly: true
        x-go-custom-tag: db:"id"
        x-nullable: false
      user_id:
        type: string
        readOnly: true
        description: "the user id this race belongs to, this is auto filled with the user profile id of the uploader"
        x-go-custom-tag: db:"user_id"
        x-nullable: false
      name_singular:
        type: string
        readOnly: true
        description: "the singular race name is auto extracted from the uploaded race file"
        x-go-custom-tag: db:"name_singular"
        x-nullable: false
      name_plural:
        type: string
        readOnly: true
        description: "the plural race name is auto extracted from the uploaded race file"
        x-go-custom-tag: db:"name_plural"
        x-nullable: false
      data:
        type: string
        description: |
          race file data as it was uploaded.
          This is generally saved by the user as something like "my_race_name.r1"
          This allows the user the re-download the file later on.
          This is also used when a user enters a session to generate the game files.
        x-go-custom-tag: db:"data"
        x-nullable: false

  session_files:
    type: object
    description: |
      a session_files is a bundle of all the files a host needs at any point in time to generate the next turn
      This exists principally so that a host can always get access to all the file of the game and take over
      the hosting duty from Neper (you never know the reasons...)
    properties:
      id:
        type: string
        readOnly: true
        x-go-custom-tag: db:"id"
        x-nullable: false
      session_id:
        type: string
        readOnly: true
        x-go-custom-tag: db:"session_id"
        x-nullable: false
      year:
        type: integer
        readOnly: true
        x-go-custom-tag: db:"year"
        x-nullable: false
      universe:
        type: string
        readOnly: true
        x-go-custom-tag: db:"universe"
        x-nullable: false
      host_file:
        type: string
        readOnly: true
        x-go-custom-tag: db:"hostfile"
        x-nullable: false
      turns:
        $ref: "#/definitions/turn_list"
      orders:
        $ref: "#/definitions/order_list"

  turn_files:
    type: object
    description: |
      a turn_files is a bundle of all the files a player needs at any point in time to generate the next orders
      This represents all the files you (as a player) would need in a directory to open stars! and play your
      turn.
      you should find a turn file and a universe file (the same file each time because the universe file does not
