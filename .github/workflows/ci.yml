name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: jdx/mise-action@v2

      - name: Run linter
        run: mise run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neper
          POSTGRES_PASSWORD: neper
          POSTGRES_DB: neper
        options: >-
          --health-cmd "pg_isready -U neper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: jdx/mise-action@v2

      - name: Run tests
        run: mise run test
        env:
          NEPER_DB_DSN: "postgres://neper:neper@localhost:5432/neper?sslmode=disable"

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: jdx/mise-action@v2

      - name: Run vulnerability check
        run: mise run vulncheck

  cover:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: neper
          POSTGRES_PASSWORD: neper
          POSTGRES_DB: neper
        options: >-
          --health-cmd "pg_isready -U neper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: jdx/mise-action@v2

      - name: Run tests with coverage
        run: mise run cover
        env:
          NEPER_DB_DSN: "postgres://neper:neper@localhost:5432/neper?sslmode=disable"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            tests-coverage.out
            tests-coverage.xml
            tests-coverage.html
