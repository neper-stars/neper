---

swagger: "2.0"
basePath: /api
info:
  description: |
    The Neper API

  title: Neper API
  version: 1.0.0
consumes:
  - application/json
produces:
  - application/json
schemes:
  - http
  - https

securityDefinitions:
  key:
    type: apiKey
    in: header
    name: Authorization
security:
  - key: []

paths:
  /v1/auth/authenticate:
    post:
      operationId: authenticate
      security: []
      parameters:
        - name: credentials
          in: body
          schema:
            $ref: "#/definitions/credentials"
      responses:
        200:
          description: A Json Web Token with a 5 minutes validity
          schema:
            type: string
        401:
          description: Invalid credentials
          schema:
            $ref: "neper-types.yaml#/definitions/error"
        default:
          description: generic error response
          schema:
            $ref: "neper-types.yaml#/definitions/error"
  /v1/auth/refresh_token:
    post:
      operationId: refresh-token
      responses:
        200:
          description: A Json Web Token with a 5 minutes validity
          schema:
            type: string
        default:
          description: generic error response
          schema:
            $ref: "neper-types.yaml#/definitions/error"

  /v1/auth/userinfo:
    get:
      operationId: userinfo
      responses:
        200:
          description: Returns the current user information
          schema:
            $ref: "#/definitions/userinfo"
        default:
          description: generic error response
          schema:
            $ref: "neper-types.yaml#/definitions/error"

  /v1/notifications:
    get:
      operationId: notifications
      summary: WebSocket endpoint for real-time resource change notifications
      description: |
        Upgrades to WebSocket connection. Sends JSON notifications when
        resources the user has access to are modified.

        Message format:
        ```json
        {
          "type": "session",
          "id": "abc123",
          "action": "updated",
          "timestamp": 1702400000
        }
        ```

        Types: session, invitation, race, ruleset, session_player_race
        Actions: created, updated, deleted
      responses:
        101:
          description: WebSocket upgrade successful
        401:
          $ref: "#/responses/unauthorized"
        default:
          $ref: "#/responses/default"

  /v1/sessions:
    get:
      operationId: sessionsList
      responses:
        200:
          description: the complete list of viewable sessions
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    post:
      operationId: sessionCreate
      description: |
        Creates a new session
      parameters:
        - name: session
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/session"
      responses:
        201:
          description: the created session
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/invite:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    post:
      operationId: invitationCreate
      parameters:
        - name: invitation
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/invitation"
      summary: "invite a player to a session. You can do this if you are the manager of this session."
      description: "invite a player to the session"
      responses:
        201:
          description: the invitation that has just been created
          schema:
            $ref: "neper-types.yaml#/definitions/invitation"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        409:
          $ref: "#/responses/conflict"
        default:
          $ref: "#/responses/default"

  /v1/invitations:
    get:
      operationId: invitationList
      responses:
        200:
          description: the complete list of viewable invitations
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/invitation"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/invitations/{invitation_id}:
    parameters:
      - name: invitation_id
        in: path
        type: string
        required: true
    put:
      operationId: invitationAccept
      description: |
        Join a session by accepting the invitation.
        You will become member of the session that is referenced in
        the invitation.
        You can only accept an invitation that was addressed to you,
        otherwise you will receive a 403 response.
        In case of success you will receive the session details of the session
        you just accepted to join.
      responses:
        200:
          description: the session you just joined
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        409:
          $ref: "#/responses/conflict"
        default:
          $ref: "#/responses/default"
    delete:
      operationId: invitationDecline
      description: |
        Decline an invitation and remove it from the system.
        You can only decline an invitation that was addressed to you,
        otherwise you will receive a 403 response.
      responses:
        204:
          $ref: "#/responses/nocontent"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/join:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    post:
      operationId: sessionJoin
      summary: "join a session, either a public one or a private one if you are invited"
      description: "join the session"
      responses:
        200:
          description: the session that has been joined
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/player_race:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    post:
      operationId: sessionPlayerRaceCreate
      summary: "set the race with which you will be competing in this session"
      description: |
        You will have to reference a previously uploaded race definition to indicate the host the race file
        you will be using for this session.
        If you are the host you will be able to change all races (in order to set some races for the bots)
        You will also be able to determine the player order.
        Players are not authorized to set their own order and an attempt to set this field will be ignored.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "session_player_race"
          in: "body"
          schema:
            $ref: "neper-types.yaml#/definitions/session_player_race"
      responses:
        200:
          description: the updated session
          schema:
            $ref: "neper-types.yaml#/definitions/session_player_race"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/player_race/ready:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    put:
      operationId: sessionPlayerRaceSetReady
      summary: "set the ready flag on the race you are playing with, in this session"
      description: |
        As a player, after setting a race file as the one you want to compete with,
        you must mark it as ready, to allow for the manager to start the game. This
        allows you to still change your mind as long as the ready flag is not set.
      parameters:
        - name: ready
          in: body
          required: true
          schema:
            type: boolean
      responses:
        200:
          description: the updated session player race mapping
          schema:
            $ref: "neper-types.yaml#/definitions/session_player_race"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/reorder_players:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    put:
      operationId: reorderPlayers
      description: |
        Update the session player order

        This is restricted to global managers or
        managers of the specific session
      parameters:
        - name: players
          in: body
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/player_order"
      responses:
        200:
          description: the updated player order
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/player_order"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        type: string
        required: true
    get:
      operationId: sessionRead
      description: |
        Return the session.
      responses:
        200:
          description: the session
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    put:
      operationId: sessionUpdate
      description: |
        Update the session

        This is restricted to global managers or
        managers of the specific session
      parameters:
        - name: session
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/session"
      responses:
        200:
          description: the updated session
          schema:
            $ref: "neper-types.yaml#/definitions/session"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/rules:
    get:
      operationId: rulesRead
      description: |
        Return the session rules.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: the session rules
          schema:
            $ref: "neper-types.yaml#/definitions/ruleset"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    post:
      operationId: rulesCreate
      summary: "create or update rules for your session"
      description: |
        Set the rules for this session. If rules already exist, they will be updated.
        You must be the session owner/manager to use this endpoint.
        Rules cannot be modified once the session has started (returns 412).
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "ruleset"
          in: "body"
          schema:
            $ref: "neper-types.yaml#/definitions/ruleset"
      responses:
        200:
          description: the uploaded ruleset
          schema:
            $ref: "neper-types.yaml#/definitions/ruleset"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/game:
    post:
      operationId: gameCreate
      summary: "initialize the game for this session"
      description: |
        Generate the first turn for this session, using the previously uploaded ruleset
        and all the player races.
        This means all players must have uploaded a valid race file,
        the rules must be set, AND all players must be marked as ready.
        You must be the session owner/manager to be able to use this endpoint.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
      responses:
        201:
          description: the created session files
          schema:
            $ref: "neper-types.yaml#/definitions/session_files"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        412:
          $ref: "#/responses/preconditionfailed"
        default:
          $ref: "#/responses/default"

  /v1/sessions/{session_id}/turn/{year}:
    get:
      operationId: turnGet
      description: |
        get your turn files
        You will get a player_turn structure containing the Universe file (.xy) data in a base64 encoded field
        and the Turn file (.mN) data in a base64 encoded field
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "year"
          in: "path"
          type: "integer"
          required: true
      responses:
        200:
          description: "the returned player turn"
          schema:
            $ref: "neper-types.yaml#/definitions/turn_files"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    put:
      operationId: turnSubmit
      summary: "submit your orders for the turn"
      description: |
        Submit your turn order file (.xN, where N is your player number)
        You should obtain this file by clicking File > Save & Submit
        Alternatively you could just press F9 in the stars! client
        A 409 error may occur if you resubmit a turn file but another one is still
        waiting to be used for turn generation. Make sure to only upload your submitted
        turn file ONCE.
        A 422 error may occur if you submit a turn file which is not marked as submitted by stars,
        ie you just clicked File > Save and uploaded your .xN file. The server will reject those files
        as 422 errors since they are not yet "submitted" in stars parlance.
      parameters:
        - name: "session_id"
          in: "path"
          type: "string"
          required: true
        - name: "year"
          in: "path"
          type: "integer"
          required: true
        - name: "turnfile"
          in: "body"
          schema:
            $ref: "neper-types.yaml#/definitions/order"
      responses:
        200:
          description: the orders for this turn has been accepted
        400:
          $ref: "#/responses/invalid"
        409:
          $ref: "#/responses/conflict"
        422:
          $ref: "#/responses/unprocessable"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/user_profiles:
    get:
      operationId: userProfileList
      responses:
        200:
          description: the complete list of user profiles
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    post:
      operationId: userProfileCreate
      description: |
        Creates a user profile.
      parameters:
        - name: user_profile
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
      responses:
        201:
          description: the created user profile
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"

  /v1/user_profiles/{user_profile_id}:
    parameters:
      - name: user_profile_id
        in: path
        type: string
        required: true
    get:
      operationId: userProfileRead
      description: |
        Return the user_profile.
      responses:
        200:
          description: the user profile
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    put:
      operationId: userProfileUpdate
      description: |
        Update the user_profile.
      parameters:
        - name: user_profile
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
      responses:
        200:
          description: the updated user profile
          schema:
            $ref: "neper-types.yaml#/definitions/user_profile"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"

  /v1/user_profiles/{user_profile_id}/races:
    get:
      operationId: racesList
      parameters:
        - name: "user_profile_id"
          in: "path"
          type: "string"
          required: true
      responses:
        200:
          description: the complete list of races for this user
          schema:
            type: array
            items:
              $ref: "neper-types.yaml#/definitions/race"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"
    post:
      operationId: raceCreate
      summary: "upload your race file for future use in a session"
      description: "Each player will need to upload at least one race file using this endpoint. Alternatively the player can choose to use a standard race during session setup."
      parameters:
        - name: "user_profile_id"
          in: "path"
          type: "string"
          required: true
        - name: race
          in: body
          schema:
            $ref: "neper-types.yaml#/definitions/race"
      responses:
        201:
          description: "the uploaded race, with the auto calculated fields filled"
          schema:
            $ref: "neper-types.yaml#/definitions/race"
        400:
          $ref: "#/responses/invalid"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        default:
          $ref: "#/responses/default"

  /v1/user_profiles/{user_profile_id}/races/{race_id}:
    parameters:
      - name: "user_profile_id"
        in: "path"
        type: "string"
        required: true
      - name: "race_id"
        in: "path"
        type: "string"
        required: true
    get:
      operationId: raceRead
      description: |
        Return the asked race from your profile.
      responses:
        200:
          description: the race definition, including the datafile
          schema:
            $ref: "neper-types.yaml#/definitions/race"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
    delete:
      operationId: raceDelete
      description: |
        Delete a race from your profile.
        You can only delete races that belong to you,
        unless you are a global manager.
        Returns 409 Conflict if the race is currently in use in a session.
      responses:
        204:
          $ref: "#/responses/nocontent"
        401:
          $ref: "#/responses/unauthorized"
        403:
          $ref: "#/responses/forbidden"
        404:
          $ref: "#/responses/notfound"
        409:
          $ref: "#/responses/conflict"
        default:
          $ref: "#/responses/default"

responses:
  nocontent:
    description: Successful

  notfound:
    description: Resource not found
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  conflict:
    description: Resource already exists
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  unprocessable:
    description: Resource is not processable by the server
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  invalid:
    description: invalid client request
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  unauthorized:
    description: Invalid credentials
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  forbidden:
    description: Access forbidden
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  preconditionfailed:
    description: Precondition not met
    schema:
      $ref: "neper-types.yaml#/definitions/error"

  default:
    description: Generic error response
    schema:
      $ref: "neper-types.yaml#/definitions/error"

definitions:
  credentials:
    type: object
    description: Credentials for authentication
    properties:
      nickname:
        type: string
        description: User nickname
      apikey:
        type: string
        description: User profile API Key
  userinfo:
    type: object
    description: Current user information
    properties:
      user:
        $ref: "#/definitions/user"
  user:
    type: object
    description: User information
    properties:
      id:
        type: string
        description: User ID
        x-go-custom-tag: db:"id"
      nickname:
        type: string
        description: User nickname
        x-go-custom-tag: db:"nickname"
