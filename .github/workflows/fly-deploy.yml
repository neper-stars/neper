name: Deploy to Fly.io

on:
  # Trigger after Release workflow completes successfully
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    environment: production
    # Only run if Release workflow succeeded (skip if failed or manually triggered)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # For workflow_run, checkout the commit that triggered the release
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Show deployment info
        run: |
          echo "Deployed version: ${{ github.event.workflow_run.head_branch || github.ref_name }}"
          flyctl status --app neper
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
